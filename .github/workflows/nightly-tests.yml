name: Nightly Tests (Full Suite)

on:
  schedule:
    # 每天 UTC 00:00 (台灣時間早上 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  full-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11"]
        test-suite:
          - name: "e2e"
            markers: "e2e"
          - name: "regression"
            markers: "regression"
          - name: "security"
            markers: "security"
          - name: "integration"
            markers: "integration"
          - name: "usability"
            markers: "usability"
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
      
      - name: Set up Ollama (Docker)
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama service to start..."
          sleep 15
      
      - name: Wait for Ollama to be ready
        run: |
          echo "Checking Ollama API availability..."
          timeout 90 bash -c 'until curl -s http://localhost:11434/api/version > /dev/null; do echo "Waiting..."; sleep 3; done'
          echo "Ollama API is ready!"
      
      - name: Pull and load model
        run: |
          echo "Pulling llama3 model..."
          docker exec ollama ollama pull llama3
          echo "Testing model with a simple query..."
          docker exec ollama ollama run llama3 "Hi" --verbose
          echo "Model is loaded and ready!"
        timeout-minutes: 5
      
      - name: Run ${{ matrix.test-suite.name }} tests
        run: |
          pytest -m "${{ matrix.test-suite.markers }}" \
            -v \
            --tb=short \
            --alluredir=allure-results \
            -n auto \
            --timeout=180
        continue-on-error: true
        timeout-minutes: 20
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-suite.name }}-py${{ matrix.python-version }}
          path: allure-results
          retention-days: 30
      
      - name: Stop Ollama
        if: always()
        run: |
          docker stop ollama
          docker rm ollama
  
  allure-report:
    runs-on: ubuntu-latest
    needs: full-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-results-combined
      
      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find allure-results-combined -type f -name "*.json" -exec cp {} allure-results/ \;
      
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
      
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: nightly-tests
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "Nightly tests failed! Check the Allure report for details."
          # 可在此加入 Slack/Teams/Email 通知邏輯
