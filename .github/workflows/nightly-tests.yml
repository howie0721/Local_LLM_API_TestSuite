name: Nightly Tests (Full Suite)

on:
  schedule:
    # 每天 UTC 00:00 (台灣時間早上 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  full-tests:
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: tinyllama
      OLLAMA_MAX_TOKENS: "32"
      OLLAMA_NUM_PREDICT: "32"
      OLLAMA_TEMPERATURE: "0.1"
      OLLAMA_TIMEOUT: "120"
      OLLAMA_RETRIES: "1"
      OLLAMA_RETRY_BACKOFF: "2.0"
    
    strategy:
      matrix:
        python-version: ["3.11"]
        test-suite:
          - name: "e2e"
            markers: "e2e"
          - name: "regression"
            markers: "regression"
          - name: "security"
            markers: "security"
          - name: "integration"
            markers: "integration"
          - name: "usability"
            markers: "usability"
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
      
      - name: Set up Ollama (Docker)
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama service to start..."
          sleep 15
      
      - name: Wait for Ollama to be ready
        run: |
          echo "Checking Ollama API availability..."
          timeout 90 bash -c 'until curl -s http://localhost:11434/api/version > /dev/null; do echo "Waiting..."; sleep 3; done'
          echo "Ollama API is ready!"
      
      - name: Pull and load model
        run: |
          echo "Pulling ${OLLAMA_MODEL} model..."
          docker exec ollama ollama pull ${OLLAMA_MODEL}
          echo "Testing model with a simple query..."
          docker exec ollama ollama run ${OLLAMA_MODEL} "Hi" --verbose
          echo "Model is loaded and ready!"
        timeout-minutes: 20
      
      - name: Run ${{ matrix.test-suite.name }} tests
        run: |
          now=$(date +"%Y-%m-%d_%H%M%S")
          resultsdir="allure-results/${now}"
          mkdir -p "$resultsdir"
          pytest -m "${{ matrix.test-suite.markers }}" \
            -v \
            --tb=short \
            --alluredir="$resultsdir" \
            -n 2 \
            --timeout=180
        continue-on-error: true
        timeout-minutes: 20
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-suite.name }}-py${{ matrix.python-version }}
          path: allure-results
          retention-days: 30
      
      - name: Stop Ollama
        if: always()
        run: |
          docker stop ollama
          docker rm ollama
  
  allure-report:
    runs-on: ubuntu-latest
    needs: full-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-report-merged
      
      - name: Merge Allure results
        run: |
          # 合併所有測試套件的結果到單一目錄
          mkdir -p allure-results-combined
          for artifact_dir in allure-report-merged/allure-results-*/allure-results/*; do
            if [ -d "$artifact_dir" ]; then
              echo "Copying results from $artifact_dir"
              cp -r "$artifact_dir"/* allure-results-combined/ || true
            fi
          done

      - name: Install Allure CLI
        run: |
          echo "Installing Allure CLI..."
          curl -o allure-commandline.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -zxvf allure-commandline.tgz -C /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure
          allure --version
      
      - name: Generate Allure report
        run: |
          # 從合併的結果產生單一報告
          mkdir -p allure-report-final
          allure generate allure-results-combined -o allure-report-final --clean
      
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report-final
          destination_dir: nightly-tests
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "Nightly tests failed! Check the Allure report for details."
          # 可在此加入 Slack/Teams/Email 通知邏輯
