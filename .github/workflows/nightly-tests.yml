name: Nightly Tests (Full Suite)

on:
  schedule:
    # 每天 UTC 00:00 (台灣時間早上 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  full-tests:
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: tinyllama
      OLLAMA_MAX_TOKENS: "32"
      OLLAMA_NUM_PREDICT: "32"
      OLLAMA_TEMPERATURE: "0.1"
      OLLAMA_TIMEOUT: "120"
      OLLAMA_RETRIES: "1"
      OLLAMA_RETRY_BACKOFF: "2.0"
    
    strategy:
      matrix:
        python-version: ["3.11"]
        test-suite:
          - name: "e2e"
            markers: "e2e"
          - name: "regression"
            markers: "regression"
          - name: "security"
            markers: "security"
          - name: "integration"
            markers: "integration"
          - name: "usability"
            markers: "usability"
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
      
      - name: Set up Ollama (Docker)
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama service to start..."
          sleep 15
      
      - name: Wait for Ollama to be ready
        run: |
          echo "Checking Ollama API availability..."
          timeout 90 bash -c 'until curl -s http://localhost:11434/api/version > /dev/null; do echo "Waiting..."; sleep 3; done'
          echo "Ollama API is ready!"
      
      - name: Pull and load model
        run: |
          echo "Pulling ${OLLAMA_MODEL} model..."
          docker exec ollama ollama pull ${OLLAMA_MODEL}
          echo "Testing model with a simple query..."
          docker exec ollama ollama run ${OLLAMA_MODEL} "Hi" --verbose
          echo "Model is loaded and ready!"
        timeout-minutes: 5
      
      - name: Run ${{ matrix.test-suite.name }} tests
        run: |
          now=$(date +"%Y-%m-%d_%H%M%S")
          marker="${{ matrix.test-suite.markers }}"
          outdir="allure-report/${marker}/${now}/report"
          mkdir -p "$outdir"
          pytest -m "$marker" \
            -v \
            --tb=short \
            --alluredir="$outdir" \
            -n 2 \
            --timeout=180
        continue-on-error: true
        timeout-minutes: 20
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-suite.name }}-py${{ matrix.python-version }}
          path: allure-report
          retention-days: 30
      
      - name: Stop Ollama
        if: always()
        run: |
          docker stop ollama
          docker rm ollama
  
  allure-report:
    runs-on: ubuntu-latest
    needs: full-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-results-combined
      
      - name: Merge Allure results
        run: |
          mkdir -p allure-report-merged
          find allure-results-combined -type f -name "*.json" -exec cp --parents {} allure-report-merged/ \;
      
      - name: Generate Allure report
        run: |
          # 產生所有 marker+時間戳的報告
          for dir in $(find allure-report-merged -type d -name report); do
            allure generate "$dir" -o "$dir" --clean || true
          done
      
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report-merged
          destination_dir: nightly-tests
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "Nightly tests failed! Check the Allure report for details."
          # 可在此加入 Slack/Teams/Email 通知邏輯
