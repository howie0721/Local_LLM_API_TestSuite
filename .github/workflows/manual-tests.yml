name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      test_markers:
        description: 'Pytest markers to run (e.g., "unit or boundary")'
        required: true
        default: 'unit'
      python_version:
        description: 'Python version'
        required: true
        default: '3.11'
        type: choice
        options:
          - '3.11'
          - '3.12'
      parallel:
        description: 'Run tests in parallel'
        required: false
        default: true
        type: boolean

jobs:
  manual-test:
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: tinyllama
      OLLAMA_MAX_TOKENS: "32"
      OLLAMA_NUM_PREDICT: "32"
      OLLAMA_TEMPERATURE: "0.1"
      OLLAMA_TIMEOUT: "120"
      OLLAMA_RETRIES: "1"
      OLLAMA_RETRY_BACKOFF: "2.0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
      
      - name: Set up Ollama (Docker)
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama service to start..."
          sleep 15
      
      - name: Wait for Ollama to be ready
        run: |
          echo "Checking Ollama API availability..."
          timeout 90 bash -c 'until curl -s http://localhost:11434/api/version > /dev/null; do echo "Waiting..."; sleep 3; done'
          echo "Ollama API is ready!"
      
      - name: Pull and load model
        run: |
          echo "Pulling ${OLLAMA_MODEL} model..."
          docker exec ollama ollama pull ${OLLAMA_MODEL}
          echo "Testing model with a simple query..."
          docker exec ollama ollama run ${OLLAMA_MODEL} "Hi" --verbose
          echo "Model is loaded and ready!"
        timeout-minutes: 20
      
      - name: Run tests (parallel)
        if: ${{ inputs.parallel }}
        run: |
          now=$(date +"%Y-%m-%d_%H%M%S")
          resultsdir="allure-results/${now}"
          mkdir -p "$resultsdir"
          pytest -m "${{ inputs.test_markers }}" \
            -v \
            --tb=short \
            --alluredir="$resultsdir" \
            -n 2 \
            --timeout=180
        timeout-minutes: 20
      
      - name: Run tests (sequential)
        if: ${{ !inputs.parallel }}
        run: |
          now=$(date +"%Y-%m-%d_%H%M%S")
          resultsdir="allure-results/${now}"
          mkdir -p "$resultsdir"
          pytest -m "${{ inputs.test_markers }}" \
            -v \
            --tb=short \
            --alluredir="$resultsdir" \
            --timeout=180
        timeout-minutes: 25
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-manual
          path: allure-results
          retention-days: 7
      
      - name: Stop Ollama
        if: always()
        run: |
          docker stop ollama
          docker rm ollama

  allure-report:
    runs-on: ubuntu-latest
    needs: manual-test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact (manual allure results)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-manual
          path: allure-report-merged

      - name: Merge Allure results
        run: |
          # 合併所有時間戳的結果到單一目錄
          mkdir -p allure-results-combined
          echo "Checking artifact structure..."
          find allure-report-merged -type f -name "*.json" | head -20
          
          # 找到所有時間戳目錄並合併結果
          for resultsdir in allure-report-merged/*/; do
            if [ -d "$resultsdir" ] && [ "$(ls -A $resultsdir 2>/dev/null)" ]; then
              echo "Copying results from $resultsdir"
              cp -r "$resultsdir"/*.json allure-results-combined/ 2>/dev/null || true
              cp -r "$resultsdir"/*-container.json allure-results-combined/ 2>/dev/null || true
              cp -r "$resultsdir"/*-result.json allure-results-combined/ 2>/dev/null || true
            fi
          done
          
          echo "Combined results:"
          ls -lh allure-results-combined/ | head -20

      - name: Install Allure CLI
        if: always()
        run: |
          echo "Installing Allure CLI..."
          curl -o allure-commandline.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -zxvf allure-commandline.tgz -C /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure report
        run: |
          # 從合併的結果產生單一報告
          mkdir -p allure-report-final
          allure generate allure-results-combined -o allure-report-final --clean

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report-final
          destination_dir: manual-tests
