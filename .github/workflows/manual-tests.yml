name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      test_markers:
        description: 'Pytest markers to run (e.g., "unit or boundary")'
        required: true
        default: 'unit'
      python_version:
        description: 'Python version'
        required: true
        default: '3.11'
        type: choice
        options:
          - '3.11'
          - '3.12'
      parallel:
        description: 'Run tests in parallel'
        required: false
        default: true
        type: boolean

jobs:
  manual-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
      
      - name: Set up Ollama (Docker)
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama service to start..."
          sleep 15
      
      - name: Wait for Ollama to be ready
        run: |
          echo "Checking Ollama API availability..."
          timeout 90 bash -c 'until curl -s http://localhost:11434/api/version > /dev/null; do echo "Waiting..."; sleep 3; done'
          echo "Ollama API is ready!"
      
      - name: Pull and load model
        run: |
          echo "Pulling llama3 model..."
          docker exec ollama ollama pull llama3
          echo "Testing model with a simple query..."
          docker exec ollama ollama run llama3 "Hi" --verbose
          echo "Model is loaded and ready!"
        timeout-minutes: 5
      
      - name: Run tests (parallel)
        if: ${{ inputs.parallel }}
        run: |
          pytest -m "${{ inputs.test_markers }}" \
            -v \
            --tb=short \
            --alluredir=allure-results \
            -n auto \
            --timeout=180
        timeout-minutes: 20
      
      - name: Run tests (sequential)
        if: ${{ !inputs.parallel }}
        run: |
          pytest -m "${{ inputs.test_markers }}" \
            -v \
            --tb=short \
            --alluredir=allure-results \
            --timeout=180
        timeout-minutes: 25
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-manual
          path: allure-results
          retention-days: 7
      
      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 10
      
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: manual-tests
      
      - name: Stop Ollama
        if: always()
        run: |
          docker stop ollama
          docker rm ollama
