name: PR Tests (Fast)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
      
      - name: Set up Ollama (Docker)
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          sleep 10
          docker exec ollama ollama pull llama3
      
      - name: Wait for Ollama to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:11434/api/version; do sleep 2; done'
      
      - name: Run fast tests (unit, boundary, compatibility, error_handling)
        run: |
          pytest -m "unit or boundary or compatibility or error_handling" \
            -v \
            --tb=short \
            --alluredir=allure-results \
            --maxfail=5 \
            -n auto
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pr-py${{ matrix.python-version }}
          path: allure-results
          retention-days: 7
      
      - name: Stop Ollama
        if: always()
        run: |
          docker stop ollama
          docker rm ollama
  
  allure-report:
    runs-on: ubuntu-latest
    needs: fast-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-results-combined
      
      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find allure-results-combined -type f -name "*.json" -exec cp {} allure-results/ \;
      
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
      
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: pr-tests
