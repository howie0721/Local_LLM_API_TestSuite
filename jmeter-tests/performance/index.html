<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JMeter 效能測試</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft JhengHei',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:40px 20px}
    .container{max-width:1100px;margin:0 auto;background:#fff;border-radius:18px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    h1{margin:0 0 24px;color:#333}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
    a.card{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);padding:24px;border-radius:14px;transition:.2s}
    a.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(240,147,251,.35)}
    .empty{background:#fff3;border-radius:12px;color:#333;padding:16px}
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 JMeter 效能測試</h1>
    <div class="grid">
<div class="empty">目前沒有可用的效能報告。請於 Actions 觸發 JMeter workflow。</div>
    </div>
  </div>
</body>
</html>
