[pytest]
addopts = -ra -q
markers =
    unit: 單元測試
    boundary: 邊界值測試
    compatibility: 相容性測試
    error_handling: 錯誤處理測試
    regression: 回歸測試
    integration: 整合測試
    e2e: 端對端測試
    security: 安全性測試
    perf: 效能測試
    stability: 穩定性測試
    usability: 易用性測試
    slow: 慢速測試
    flaky: 偶發不穩定
filterwarnings =
    ignore::DeprecationWarning